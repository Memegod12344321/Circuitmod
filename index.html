<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CircuitMod — Forge 1.20.1 Builder</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080a10;color:#f4f6fb;font:15px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:22px}.hero{padding:28px 4px 12px}.hero h1{font-size:38px;margin:0 0 6px}.muted{color:#9ca7bb}.card{background:#121722;border:1px solid #293245;border-radius:18px;padding:20px;margin:16px 0}label{display:block;margin:12px 0 6px;font-weight:650}input,select,textarea{width:100%;padding:12px;border-radius:11px;border:1px solid #354057;background:#0a0d14;color:#fff}textarea{min-height:120px}button{border:0;border-radius:11px;padding:12px 17px;margin:5px 5px 0 0;font-weight:750;cursor:pointer;background:#8b5cf6;color:#fff}button.secondary{background:#293245}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#090c12;border-radius:11px;padding:14px;min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.row{grid-template-columns:1fr}.hero h1{font-size:31px}}a.download{display:inline-block;background:#35b86f;color:#07130c;text-decoration:none;padding:12px 17px;border-radius:11px;font-weight:800;margin-top:10px}</style>
</head><body><main><div class="hero"><h1>CircuitMod ⚡</h1><div class="muted">Forge 1.20.1 • Java 17 • GitHub-powered compilation</div></div>
<section class="card"><h2>1. GitHub</h2><label>GitHub API token</label><input id="token" type="password" placeholder="●●●●●●●●●●" autocomplete="off"><div class="muted">Kept only in memory. Cleared when the page is left or refreshed.</div><div class="row"><div><label>Repository</label><input id="repo" value="Memegod12344321/Circuitmod"></div><div><label>Branch</label><input id="branch" value="main"></div></div></section>
<section class="card"><h2>2. Build a mod</h2><div class="row"><div><label>Mod name</label><input id="name" value="My Circuit Mod"></div><div><label>Mod ID</label><input id="id" value="my_circuit_mod"></div></div><label>Description</label><textarea id="desc" placeholder="Describe your mod..."></textarea><label>Template</label><select id="template"><option value="basic">Basic Forge mod</option><option value="item">Custom item</option><option value="mob">Hostile mob</option></select><button id="build">Generate & Build .jar</button><button class="secondary" id="clear">Clear session</button></section>
<section class="card"><h2>3. Status</h2><pre id="status">Ready.</pre><div id="download"></div></section></main>
<script>
const $=x=>document.getElementById(x);
function b64(s){return btoa(unescape(encodeURIComponent(s)))}function tok(){const t=$("token").value.trim();if(!t)throw Error("Enter your GitHub token first.");return t}
async function api(p,o={}){const h={...(o.headers||{}),Authorization:"Bearer "+tok(),Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};if(o.body)h["Content-Type"]="application/json";const r=await fetch("https://api.github.com"+p,{...o,headers:h}),t=await r.text();if(!r.ok)throw Error(r.status+" "+t);return t?JSON.parse(t):{}}
function makeSpec(){const id=$("id").value.trim(),n=$("name").value.trim()||id,d=$("desc").value.trim();if(!/^[a-z0-9_]+$/.test(id))throw Error("Mod ID must use lowercase letters, numbers, and underscores.");if(!d)throw Error("Add a description.");return{request_id:"circuitmod-"+Date.now()+"-"+Math.random().toString(36).slice(2,8),mod_name:n,mod_id:id,description:d,template:$("template").value,minecraft_version:"1.20.1",forge_version:"47.4.10",java_version:17}}
async function waitBuild(repo,sha,tag){for(let i=0;i<90;i++){await new Promise(r=>setTimeout(r,5000));const q=await api("/repos/"+repo+"/actions/runs?head_sha="+encodeURIComponent(sha)+"&per_page=10"),run=q.workflow_runs&&q.workflow_runs[0];if(!run)continue;$("status").textContent="GitHub Actions: "+run.status+(run.conclusion?" / "+run.conclusion:"")+"\\nRun #"+run.run_number;if(run.status==="completed"){if(run.conclusion!=="success")throw Error("Build failed. Open the run: "+run.html_url);const rel=await api("/repos/"+repo+"/releases/tags/"+encodeURIComponent(tag)),a=(rel.assets||[]).find(x=>x.name.endsWith(".jar"));if(!a)throw Error("Build finished but no JAR was found.");$("download").innerHTML='<a class="download" href="'+a.browser_download_url+'" target="_blank">⬇ Download '+a.name+"</a>";$("status").textContent="BUILD SUCCESSFUL\\nForge 1.20.1 JAR is ready.";return}}throw Error("Timed out waiting for GitHub Actions.")}
$("build").onclick=async()=>{try{const repo=$("repo").value.trim(),branch=$("branch").value.trim()||"main";const s=makeSpec();const path="requests/"+s.request_id+".json";$("status").textContent="Uploading request...";const r=await api("/repos/"+repo+"/contents/"+path,{method:"PUT",body:JSON.stringify({message:"CircuitMod build "+s.request_id,content:b64(JSON.stringify(s,null,2)),branch})});$("status").textContent="Uploaded. Waiting for GitHub Actions...";await waitBuild(repo,r.commit.sha,s.request_id)}catch(e){$("status").textContent="ERROR\\n"+e.message}};
$("clear").onclick=()=>{$("token").value="";$("desc").value="";$("download").innerHTML="";$("status").textContent="Session cleared."};window.addEventListener("pagehide",()=>{$("token").value=""});
</script></body></html>
