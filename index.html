<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CircuitMod</title><style>body{margin:0;background:#090b12;color:#fff;font-family:system-ui;padding:18px}main{max-width:850px;margin:auto}.card{background:#151925;border:1px solid #30384b;border-radius:18px;padding:20px;margin:15px 0}input,textarea,select{width:100%;box-sizing:border-box;background:#0b0e16;color:white;border:1px solid #3a4358;border-radius:10px;padding:12px;margin:6px 0 14px}textarea{min-height:130px}button{background:#9b5cff;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;margin:4px;cursor:pointer}button:disabled{opacity:.5}small{color:#aeb6c8}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:220px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h1>CircuitMod ⚡</h1><small>Built-in Forge 1.20.1 generator • GitHub compiler</small><section class="card"><h2>GitHub connection</h2><label>GitHub API token</label><input id="token" type="password" placeholder="●●●●●●●●●●" autocomplete="off"><small>The token stays in memory only and is cleared when this page is left or refreshed. Never use a broad-permission token.</small><label>Repository</label><input id="repo" value="Memegod12344321/Circuitmod"><label>Branch</label><input id="branch" value="main"></section><section class="card"><h2>Create mod</h2><label>Mod name</label><input id="name" value="My Circuit Mod"><label>Mod ID</label><input id="id" value="my_circuit_mod"><label>Description</label><textarea id="desc" placeholder="Example: Add a hostile ghost mob that follows the player..."></textarea><label>Template</label><select id="template"><option value="basic">Basic Forge mod</option><option value="mob">Hostile mob starter</option><option value="item">Custom item starter</option></select><button id="build">Generate and send to GitHub</button><button id="clear">Clear session</button></section><section class="card"><h2>Status</h2><pre id="status">Ready.</pre></section></main><script>const $=id=>document.getElementById(id);let files=null;function spec(){const id=$('id').value.trim(),d=$('desc').value.trim();if(!/^[a-z0-9_]+$/.test(id))throw Error('Mod ID must contain lowercase letters, numbers, and underscores.');if(!d)throw Error('Add a description.');return {mod_name:$('name').value.trim()||id,mod_id:id,description:d,template:$('template').value,minecraft_version:'1.20.1',loader:'forge',java_version:17};}function b64(s){return btoa(unescape(encodeURIComponent(s)));}async function api(url,options={}){const token=$('token').value.trim();if(!token)throw Error('Enter your GitHub token.');options.headers={...(options.headers||{}),Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'};const r=await fetch('https://api.github.com'+url,options);const text=await r.text();if(!r.ok)throw Error(r.status+' '+text);return text?JSON.parse(text):{};}$('build').onclick=async()=>{try{const s=spec(),repo=$('repo').value.trim(),branch=$('branch').value.trim()||'main';if(!repo.includes('/'))throw Error('Repository must look like owner/name.');$('status').textContent='Generating files...';const payload={spec:s,generated_at:new Date().toISOString()};const path='generated/spec.json';let existing=null;try{existing=await api('/repos/'+repo+'/contents/'+path+'?ref='+encodeURIComponent(branch));}catch(e){}const body={message:'Generate '+s.mod_id,content:b64(JSON.stringify(payload,null,2)),branch};if(existing)body.sha=existing.sha;await api('/repos/'+repo+'/contents/'+path,{method:'PUT',body:JSON.stringify(body)});$('status').textContent='Specification uploaded. GitHub Actions must read generated/spec.json and compile the Forge project. If the workflow is configured for workflow_dispatch, trigger it from GitHub Actions.';}catch(e){$('status').textContent='Error: '+e.message;}};$('clear').onclick=()=>{$('token').value='';$('name').value='My Circuit Mod';$('id').value='my_circuit_mod';$('desc').value='';$('status').textContent='Session cleared.';files=null};window.addEventListener('pagehide',()=>{$('token').value='';files=null});</script></body></html>
