<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CircuitMod</title><style>body{margin:0;background:#090b12;color:#fff;font-family:system-ui;padding:20px}main{max-width:800px;margin:auto}.card{background:#151925;border:1px solid #30384b;border-radius:18px;padding:20px;margin:15px 0}input,textarea{width:100%;box-sizing:border-box;background:#0b0e16;color:white;border:1px solid #3a4358;border-radius:10px;padding:12px;margin:6px 0 14px}textarea{min-height:140px}button{background:#9b5cff;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700}small{color:#aeb6c8}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:220px}</style></head><body><main><h1>CircuitMod ⚡</h1><small>Forge 1.20.1 mod generator</small><section class="card"><h2>Settings</h2><label>Groq API key</label><input id="key" type="password" placeholder="●●●●●●●●●●" autocomplete="off"><small>Your key is only kept in this page session and is cleared when you leave or reload. It is never saved to localStorage.</small></section><section class="card"><h2>Create your mod</h2><label>Mod name</label><input id="name" value="My Circuit Mod"><label>Mod ID</label><input id="id" value="my_circuit_mod"><label>Description</label><textarea id="desc" placeholder="Describe what your Minecraft mod should do..."></textarea><div class="row"><button id="generate">Generate JSON</button><button id="clear">Clear session</button></div></section><section class="card"><h2>Output</h2><pre id="output" style="white-space:pre-wrap;overflow-wrap:anywhere">Ready.</pre></section></main><script>const $=x=>document.getElementById(x);let request=null;$('generate').onclick=()=>{const id=$('id').value.trim();const desc=$('desc').value.trim();if(!/^[a-z0-9_]+$/.test(id)||!desc){$('output').textContent='Use a valid lowercase mod ID and add a description.';return}request={mod_name:$('name').value.trim()||id,mod_id:id,description:desc,minecraft_version:'1.20.1',loader:'forge',java_version:17};$('output').textContent=JSON.stringify(request,null,2)};$('clear').onclick=()=>{request=null;$('key').value='';$('name').value='My Circuit Mod';$('id').value='my_circuit_mod';$('desc').value='';$('output').textContent='Session cleared.'};window.addEventListener('pagehide',()=>{$('key').value='';request=null});</script></body></html>
