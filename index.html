<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Llama KDP Notebook Generator</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script></head><body><header><b>LLAMA KDP</b><span>NOTEBOOK GENERATOR</span><button id="settingsBtn">⚙ Settings</button></header><main><section class="hero"><h1>Make a notebook.</h1><p>Generate interiors, covers and metadata from one workspace.</p><button class="primary" id="generateAi">✨ Generate with Llama</button><button id="overpowered">⚡ Overpowered: OFF</button></section><section class="grid"><div class="panel"><h2>Notebook</h2><label>Title<input id="title" placeholder="My Awesome Notebook"></label><label>Subtitle<input id="subtitle" placeholder="Write, plan and create"></label><label>Type<select id="type"><option value="lined">Lined</option><option value="wide">Wide ruled</option><option value="college">College ruled</option><option value="graph">Graph</option><option value="dot">Dot grid</option><option value="blank">Blank</option><option value="checklist">Checklist</option><option value="planner">Planner</option><option value="journal">Journal prompts</option></select></label><label>Trim<select id="trim"><option value="6x9">6 × 9 in</option><option value="7x10">7 × 10 in</option><option value="8x10">8 × 10 in</option><option value="8.5x11">8.5 × 11 in</option></select></label><label>Pages<input id="pages" type="number" min="24" max="800" value="120"></label><label>Theme<input id="theme" placeholder="Minimal, cute, dark academia..."></label></div><div class="panel"><h2>Preview</h2><div class="book"><div class="page"><strong id="pageTitle">Notebook</strong><div id="previewLines"></div></div></div><div class="nav"><button id="prev">←</button><span id="pageCount"></span><button id="next">→</button></div></div></section><section class="panel advanced" id="advanced"><h2>Advanced / Overpowered</h2><div class="controls"><label>Line spacing<input id="spacing" type="range" min="4" max="18" value="9"></label><label>Margin<input id="margin" type="range" min="5" max="30" value="14"></label><label>Grid size<input id="cell" type="range" min="4" max="20" value="9"></label><label>Header<input id="header" placeholder="Name / Date"></label><label>Footer<input id="footer" placeholder="Optional footer"></label></div><div class="checks"><label><input id="numbering" type="checkbox" checked> Page numbers</label><label><input id="headers" type="checkbox"> Header</label><label><input id="bleed" type="checkbox"> Bleed</label><label><input id="prompts" type="checkbox"> AI prompts</label></div></section><section class="panel"><h2>Export</h2><div class="exports"><button id="pdf">📄 Interior PDF</button><button id="cover">🎨 Cover PDF</button><button id="json">💾 Project JSON</button><button id="save">Save</button></div><pre id="status">Ready.</pre></section></main><dialog id="settings"><form method="dialog"><h2>Llama Settings</h2><label>API endpoint<input id="endpoint" value="https://api.groq.com/openai/v1/chat/completions"></label><label>Model<input id="model" value="llama-3.3-70b-versatile"></label><label>API key<input id="key" type="password"></label><label>Temperature<input id="temperature" type="number" min="0" max="2" step=".1" value=".7"></label><button value="cancel">Close</button><button id="saveSettings" class="primary">Save</button><small>API keys are stored locally in this browser.</small></form></dialog><script src="app.js"></script></body></html>
