name: Build The Stalker (Forge 1.20.1)
on:
  push:
    paths:
      - 'stalker-mod/**'
      - '.github/workflows/stalker-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Forge 1.20.1 MDK
        run: |
          curl -L --fail --retry 3 -o forge-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          mkdir mdk
          unzip -q forge-mdk.zip -d mdk
      - name: Inject The Stalker source
        run: |
          cp stalker-mod/build.gradle mdk/build.gradle
          cp stalker-mod/gradle.properties mdk/gradle.properties
          cp stalker-mod/settings.gradle mdk/settings.gradle
          rm -rf mdk/src/main
          mkdir -p mdk/src/main
          cp -R stalker-mod/src/main/. mdk/src/main/
      - name: Compile mod
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace
      - name: Upload compiled mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: The-Stalker-Forge-1.20.1
          path: mdk/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
