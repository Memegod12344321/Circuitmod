name: Compile uploaded Minecraft mod
on:
  push:
    paths:
      - 'uploads/*.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Find uploaded source ZIP
        id: source
        shell: bash
        run: |
          ZIP=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^uploads/.*\.zip$' | tail -1 || true)
          if [ -z "$ZIP" ]; then
            echo "No new ZIP found under uploads/. Upload a ZIP of the mod's SOURCE PROJECT, including build.gradle and src/."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
      - name: Extract source project
        run: |
          mkdir -p source
          unzip -q "${{ steps.source.outputs.zip }}" -d source
          WRAPPER=$(find source -type f -name gradlew -print -quit)
          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR=$(dirname "$WRAPPER")
          else
            BUILD_FILE=$(find source -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)
            if [ -z "$BUILD_FILE" ]; then
              echo "This ZIP has no Gradle build.gradle/build.gradle.kts. A compiled .jar or decompiled folder without build files cannot be compiled directly."
              exit 1
            fi
            PROJECT_DIR=$(dirname "$BUILD_FILE")
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project folder: $PROJECT_DIR"
          echo "--- Loader/version hints ---"
          grep -R -I -m 2 -E 'minecraft_version|minecraftVersion|forge_version|neoforge|fabric-loader|modLoader|fabric.mod.json|1\.20\.1|1\.21\.' "$PROJECT_DIR" --include='gradle.properties' --include='build.gradle' --include='build.gradle.kts' --include='mods.toml' --include='fabric.mod.json' --include='neoforge.mods.toml' | head -40 || true
      - name: Build mod
        shell: bash
        run: |
          cd "$project_dir"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon --stacktrace
          else
            gradle build --no-daemon --stacktrace
          fi
      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: compiled-minecraft-mod
          path: |
            ${{ env.project_dir }}/build/libs/*.jar
            !${{ env.project_dir }}/build/libs/*-sources.jar
            !${{ env.project_dir }}/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14
