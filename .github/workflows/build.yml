name: CircuitMod Forge 1.20.1 Build
on:
  push:
    paths: ['requests/*.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Find request
        id: req
        shell: bash
        run: |
          FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^requests/.*\.json$' | tail -1 || true)
          test -n "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
      - name: Download Forge MDK
        run: |
          curl -L --fail --retry 3 -o forge.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          mkdir mdk && unzip -q forge.zip -d mdk
      - name: Generate
        run: python3 tools/generate.py "${{ steps.req.outputs.file }}" mdk
      - name: Compile
        working-directory: mdk
        run: chmod +x gradlew && ./gradlew clean build --no-daemon --stacktrace
      - name: Release JAR
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          ID=$(python3 -c "import json;print(json.load(open('${{ steps.req.outputs.file }}'))['request_id'])")
          JAR=$(find mdk/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -1)
          test -n "$JAR"
          gh release delete "$ID" --yes 2>/dev/null || true
          gh release create "$ID" "$JAR" --title "CircuitMod $ID" --notes "Forge 1.20.1 build"
      - uses: actions/upload-artifact@v4
        with: {name: CircuitMod-JAR, path: mdk/build/libs/*.jar}
