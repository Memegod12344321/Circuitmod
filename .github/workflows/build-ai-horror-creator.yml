name: Build Forge AI Horror Creator

on:
  workflow_dispatch:
  push:
    paths:
      - "ai-horror-creator/**"
      - ".github/workflows/build-ai-horror-creator.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-horror-creator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build Forge mod
        run: gradle --no-daemon build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ai-horror-creator-forge1201
          path: ai-horror-creator/build/libs/*.jar
          if-no-files-found: error
